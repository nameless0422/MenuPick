name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    # dev 직접 push가 실제 작업 방식이므로 dev도 포함 — 없으면 main PR 전까지 테스트가 안 돈다 (#14)
    # docker-build 잡은 아래 if 조건으로 여전히 main push에서만 실행된다.
    branches: [main, dev]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # tsc가 잡지 못하는 종류(닿지 않는 코드, 빠뜨린 훅 의존성, 잘못 쓴 훅 규칙)를 본다.
      # 빌드보다 먼저 두는 건 훨씬 빨라서 — 이 잡이 깨질 때 4초 만에 알 수 있다.
      # 경고로 실패시키지는 않는다. oxlint의 기본 경고에는 스타일 취향(예: Fast Refresh
      # 권고)이 섞여 있어, 이대로 --deny-warnings를 켜면 지금 있는 경고 하나 때문에
      # 무관한 PR이 전부 빨갛게 뜬다. 오류 등급 규칙만 CI를 막는다.
      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # 백엔드 실행 없이 정적으로 확인 가능한 것만: tsc + vite build
        run: npm run build

      # jsdom 기반이라 브라우저 바이너리 없이 그대로 돌아간다.
      - name: Test
        run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        # test가 아니라 check를 부른다 — 커버리지 하한(jacocoTestCoverageVerification)까지 함께 돈다.
        # Testcontainers(6번 백로그)가 MySQL 컨테이너를 직접 띄우므로 별도 서비스 컨테이너는 불필요.
        # ubuntu-latest 러너는 Docker 데몬이 기본 탑재되어 있다.
        run: ./gradlew check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 컨테이너 레지스트리는 저장소 이름에 소문자만 허용한다. github.repository는
      # 'nameless0422/MenuPick'처럼 원래 대소문자를 그대로 주므로 그대로 태그에 쓰면
      # "repository name must be lowercase"로 빌드 시작 전에 실패한다.
      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 멀티아치 빌드는 buildx가 필요하고, 러너와 다른 아키텍처의 단계를 실행하려면
      # binfmt 핸들러(QEMU)가 등록돼 있어야 한다. 기본 러너에는 둘 다 없다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # ghcr.io는 GITHUB_TOKEN만으로 인증되어 별도 시크릿 설정이 필요 없다.
        # 실제 배포(어디에 이 이미지를 pull해서 띄울지)는 배포 대상 확정 후 별도 과제
        # (docs/ImprovementBacklog.md 8번, docs/DecisionLog.md D-019).
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 배포 대상(OCI Ampere A1)이 arm64라 amd64 이미지만으로는 pull해서 띄울 수 없다.
          # Dockerfile의 빌드 단계가 $BUILDPLATFORM에 고정돼 있어 Gradle 빌드는 러너에서
          # 네이티브로 한 번만 돌고, 아키텍처별로 갈리는 건 JRE 베이스뿐이다.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
