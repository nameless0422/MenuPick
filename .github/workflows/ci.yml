name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    # dev 직접 push가 실제 작업 방식이므로 dev도 포함 — 없으면 main PR 전까지 테스트가 안 돈다 (#14)
    # docker-build 잡은 아래 if 조건으로 여전히 main push에서만 실행된다.
    branches: [main, dev]

# 잡별로 올려 쓰기 전까지는 읽기만 준다. 선언이 없으면 리포지토리 기본값을 상속하는데,
# 그 값이 read/write이면 PR로 실행되는 npm ci(전이 의존성의 postinstall 스크립트 수백 개)와
# ./gradlew check가 쓰기 권한을 가진 토큰이 있는 환경에서 돈다.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # tsc가 잡지 못하는 종류(닿지 않는 코드, 빠뜨린 훅 의존성, 잘못 쓴 훅 규칙)를 본다.
      # 빌드보다 먼저 두는 건 훨씬 빨라서 — 이 잡이 깨질 때 4초 만에 알 수 있다.
      # 경고로 실패시키지는 않는다. oxlint의 기본 경고에는 스타일 취향(예: Fast Refresh
      # 권고)이 섞여 있어, 이대로 --deny-warnings를 켜면 지금 있는 경고 하나 때문에
      # 무관한 PR이 전부 빨갛게 뜬다. 오류 등급 규칙만 CI를 막는다.
      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # 백엔드 실행 없이 정적으로 확인 가능한 것만: tsc + vite build
        run: npm run build

      # jsdom 기반이라 브라우저 바이너리 없이 그대로 돌아간다.
      - name: Test
        run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run tests
        # test가 아니라 check를 부른다 — 커버리지 하한(jacocoTestCoverageVerification)까지 함께 돈다.
        # Testcontainers(6번 백로그)가 MySQL 컨테이너를 직접 띄우므로 별도 서비스 컨테이너는 불필요.
        # ubuntu-latest 러너는 Docker 데몬이 기본 탑재되어 있다.
        run: ./gradlew check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

  # 백엔드와 프론트 이미지를 함께 빌드한다. 프론트만 CI 밖에 두면 (1) 되돌릴 태그가 없어
  # git을 되감고 VM에서 재빌드해야 하고, (2) `up -d`가 이미 있는 로컬 이미지를 재빌드하지
  # 않으므로 --build를 빠뜨린 배포가 백엔드만 새 버전이고 프론트는 옛 번들인 상태로 돈다.
  # VITE_* 값은 빌드 타임에 번들로 구워지므로 키를 바꿔도 그때는 반영되지 않는다(#82).
  #
  # PR에서도 이미지가 빌드되는지 확인한다. main push에서만 돌리면 Dockerfile을 고친 PR이
  # 초록으로 머지된 뒤 main에서 처음 깨지고, 그때는 이미 main이 깨진 상태인 데다 :latest가
  # 갱신되지 않아 사정을 모르는 배포가 옛 이미지를 계속 받는다.
  # PR에서는 amd64만 빌드한다 — arm64는 QEMU 에뮬레이션이라 검증 대비 비용이 크고,
  # 아키텍처별로 갈리는 건 JRE 베이스뿐이라 amd64가 통과하면 Dockerfile 자체는 유효하다.
  docker-build:
    # frontend까지 기다린다. test만 걸어 두면 lint·tsc·vitest가 빨개도 이미지가 푸시된다.
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # 푸시 여부를 한 곳에서 정한다 — 로그인·플랫폼·push가 전부 이 값을 따라간다.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 컨테이너 레지스트리는 저장소 이름에 소문자만 허용한다. github.repository는
      # 'nameless0422/MenuPick'처럼 원래 대소문자를 그대로 주므로 그대로 태그에 쓰면
      # "repository name must be lowercase"로 빌드 시작 전에 실패한다.
      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 멀티아치 빌드는 buildx가 필요하고, 러너와 다른 아키텍처의 단계를 실행하려면
      # binfmt 핸들러(QEMU)가 등록돼 있어야 한다. 기본 러너에는 둘 다 없다.
      - name: Set up QEMU
        # arm64 단계를 러너에서 실행하려면 binfmt 핸들러가 필요하다. amd64만 빌드하는
        # PR 검증에는 쓸모가 없어 건너뛴다(등록 자체가 수십 초 든다).
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        # 푸시하지 않는 PR 검증에서는 로그인하지 않는다. fork PR의 GITHUB_TOKEN은
        # packages 쓰기 권한이 없어 로그인 단계에서 먼저 실패한다.
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        # ghcr.io는 GITHUB_TOKEN만으로 인증되어 별도 시크릿 설정이 필요 없다.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          # 배포 대상(OCI Ampere A1)이 arm64라 amd64 이미지만으로는 pull해서 띄울 수 없다.
          # Dockerfile의 빌드 단계가 $BUILDPLATFORM에 고정돼 있어 Gradle 빌드는 러너에서
          # 네이티브로 한 번만 돌고, 아키텍처별로 갈리는 건 JRE 베이스뿐이다.
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # PR 검증이 매번 Gradle 빌드를 처음부터 돌지 않도록 레이어를 재사용한다.
          # 스코프를 나누지 않으면 두 빌드가 같은 gha 캐시를 서로 덮어써
          # 매번 캐시 미스가 난다(조용히 느려질 뿐이라 알아채기 어렵다).
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      # 프론트 이미지도 같은 커밋 SHA로 태그한다. compose가 두 이미지에 같은 APP_VERSION을
      # 쓰므로 태그가 어긋나면 그 배포는 아예 pull에 실패한다 — 조용한 버전 불일치보다
      # 시끄러운 실패가 낫다.
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: ${{ env.PUBLISH == 'true' }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_BASE_URL=
            VITE_KAKAO_JS_KEY=${{ secrets.VITE_KAKAO_JS_KEY }}
          tags: |
            ${{ steps.image.outputs.name }}-web:${{ github.sha }}
            ${{ steps.image.outputs.name }}-web:latest
