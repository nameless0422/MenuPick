name: Security

# ci.yml과 분리한 이유: 새 공지는 코드 변경 없이도 나오므로 정기 실행이 필요한데, 일정으로
# 빌드·테스트·이미지 게시까지 함께 돌릴 이유가 없다. 이 워크플로는 이미지를 게시하지 않는다.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # 매주 월요일 09:00 KST
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # 잠금 파일만 읽으므로 npm ci가 필요 없다 — 전이 의존성의 설치 스크립트를 실행하지 않는다.
      # 개발 의존성도 포함한다. 개발 PC와 CI에도 저장소·토큰이 있어 무시할 대상이 아니다.
      - name: Audit lockfile
        run: npm audit --audit-level=high

  # 해석된 전이 의존성과 OS 패키지를 실제 산출물 기준으로 본다. 백엔드는 fat jar 안의 라이브러리까지
  # 검사되므로 build.gradle에 적힌 직접 의존성 목록보다 정확하다.
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      # 한 이미지의 실패가 다른 이미지의 결과를 가리지 않게 한다.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: menupick-scan-${{ matrix.name }}:ci
          # ci.yml과 스코프를 나눈다. 같으면 서로의 캐시를 덮어써 매번 미스가 난다.
          cache-from: type=gha,scope=scan-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.name }}

      # trivy-action 대신 digest로 고정한 공식 이미지를 직접 실행한다. 2026-03 사고에서 그 액션의
      # 태그 대부분이 변조됐고(GHSA-69fq-xp46-6x23), 이 잡에 필요한 것은 명령 한 줄뿐이다.
      # 0.76.2는 사고 범위(0.69.4~0.69.6) 밖의 릴리스다.
      #
      # 예외는 .trivyignore.yaml에 근거(statement)와 만료일(expired_at)을 함께 적는다.
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /.trivyignore.yaml \
            --exit-code 1 \
            --no-progress \
            menupick-scan-${{ matrix.name }}:ci

  # 런타임 서드파티 이미지(DB·Redis·Mailpit)는 CI가 빌드하지 않아 위 image-scan 매트릭스에 없었다.
  # 코드와 무관하게 새 CVE가 나오므로 주간 일정·수동 실행에서만 돈다 — PR에서는 돌지 않아 무관한
  # PR을 빨갛게 하지 않는다. 스캔 대상은 compose에 적힌 pin을 그대로 읽어 단일 출처로 둔다.
  #   - redis: 우리의 깨끗한 지원 베이스(Alpine 3.22)라 HIGH/CRIT가 생기면 실패시켜 digest 갱신을 알린다.
  #   - mysql·mailpit: 우리가 쓰지 않는 벤더 번들(mysqlsh의 Python/Go 등) CVE가 남아 보고만 한다.
  #     근본 해소는 mysql 8.4 EOL 전 이전과 mailpit 상류 패치다(docs/DecisionLog.md D-072).
  infra-image-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned images from compose
        id: imgs
        run: |
          {
            echo "redis=$(grep -oP 'image:\s*\Kredis:\S+' docker-compose.prod.yml)"
            echo "mysql=$(grep -oP 'image:\s*\Kmysql:\S+' docker-compose.prod.yml)"
            echo "mailpit=$(grep -oP 'image:\s*\Kaxllent/mailpit:\S+' deploy/oci/docker-compose.oci.yml)"
          } >> "$GITHUB_OUTPUT"

      - name: Scan redis (must stay clean)
        run: |
          docker run --rm \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${{ steps.imgs.outputs.redis }}"

      - name: Scan mysql and mailpit (report only)
        run: |
          for img in "${{ steps.imgs.outputs.mysql }}" "${{ steps.imgs.outputs.mailpit }}"; do
            echo "### $img" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm \
              aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress \
              --format table "$img" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  # Gradle 전이 의존성은 저장소 파일에 드러나지 않아 Dependabot 경고가 닿지 않는다.
  # 해석 결과를 GitHub 의존성 그래프에 제출한다. 쓰기 권한이 필요해 main push에서만 돈다.
  gradle-dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
