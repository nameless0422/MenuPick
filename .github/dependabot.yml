# 의존성 업데이트 자동 감시.
#
# 이 리포에는 취약점 스캔이 하나도 없었다. jjwt·bcprov 같은 암호 라이브러리에 CVE가 나도
# 사람이 공지를 직접 챙기지 않으면 영영 반영되지 않는다. github-actions도 함께 보는데,
# ci.yml의 액션들을 커밋 SHA로 고정해 두었기 때문이다 — 고정은 공급망 위험을 막는 대신
# 업데이트를 사람 손에 맡기므로, 그 손을 dependabot이 대신한다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 스프링 부트 BOM이 끌고 오는 것들은 따로 올리면 버전이 어긋난다. 한 PR로 묶는다.
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 개발 의존성은 런타임에 나가지 않아 개별 검토 가치가 낮다. 묶어서 한 번에 본다.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
