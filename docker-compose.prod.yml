# 자체 호스팅 배포용 (예: Oracle Cloud Free Tier VM). 로컬 개발용 docker-compose.yml과는
# 별개 파일이다 — 로컬은 앱을 IDE/gradle로 직접 띄우고 MySQL/Redis만 컨테이너로 쓰지만,
# 이 파일은 앱까지 포함한 스택 전체를 한 대의 서버에서 띄우는 용도다.
#
# 사용법:
#   1. .env.prod.example을 .env.prod로 복사하고 실제 값 채우기 (Git에 커밋 금지)
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# docs/DecisionLog.md D-023, docs/Planning.md 6.1 참고.

# Docker의 json-file 드라이버는 기본이 무제한이라 로그가 디스크를 채울 때까지 자란다.
# 이 구성은 앱·MySQL·Redis가 한 VM을 공유하므로, 디스크가 차면 앱만 죽는 게 아니라
# MySQL이 쓰기를 못 해 서비스 전체가 멎는다. 세 서비스 모두 같은 상한을 쓴다.
# 서비스당 20MB × 5개 = 최대 100MB, 합계 300MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    container_name: menupick-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: menupick
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      # utf8mb4_unicode_ci(UCA 4.0.0)는 모든 이모지를 같은 문자로 취급해
      # 닉네임·태그의 UNIQUE를 오작동시킨다(V7, issue #114). MySQL 8 기본값인
      # 0900_ai_ci는 UCA 9.0.0 기반이라 이모지를 정확히 구분한다.
      # 이 값은 새로 만들어지는 스키마의 기본값을 정한다 — 이미 만들어진
      # menupick 스키마 자체는 V7의 ALTER DATABASE가 바꾼다.
      - --collation-server=utf8mb4_0900_ai_ci
      # MySQL 메모리의 대부분은 여기서 나온다. mem_limit을 줄일 때 이걸 같이 줄이지 않으면
      # 버퍼 풀만으로 한도를 넘어 컨테이너가 OOMKill된다.
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # app이 "DB가 실제로 쿼리를 받는 상태"가 된 뒤에 뜨도록 하는 신호.
      # 컨테이너가 떠 있는 것과 mysqld가 접속을 받는 것은 다르다(초기화에 수십 초 걸린다).
      # CMD-SHELL: exec 형식은 셸을 거치지 않아 $MYSQL_ROOT_PASSWORD가 리터럴로 전달된다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # 단일 VM(예: 1 OCPU / 6GB) 전제의 메모리 배분. 합계가 호스트 메모리보다 작아야
    # 한 컨테이너의 누수가 다른 컨테이너를 OOMKill로 끌고 들어가지 않는다.
    # MySQL은 innodb_buffer_pool(기본 128MB) + 커넥션당 버퍼 기준으로 1g면 충분하다.
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: menupick-redis
    restart: unless-stopped
    # AOF persistence 활성화 — Redis 재기동 시 Refresh Token 유실 최소화 (docs/DecisionLog.md D-015)
    # requirepass: Redis는 기본 무인증이라, 네트워크가 한 번이라도 노출되면 Refresh Token 저장소가
    #   그대로 읽힌다. 포트를 외부에 열지 않더라도 방어선을 하나 더 둔다.
    # maxmemory-policy noeviction: 이 Redis는 캐시 겸 Refresh Token 저장소다. LRU eviction을 켜면
    #   메모리가 찼을 때 살아 있는 Refresh Token이 조용히 증발해 사용자가 임의로 로그아웃된다.
    #   대신 한도에 닿으면 쓰기가 실패하고(= 관측 가능한 장애) 캐시 TTL로 자연 회수된다.
    #   maxmemory는 mem_limit(256m)보다 낮게 잡아 AOF 버퍼/오버헤드 여유를 남긴다.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      # mem_limit보다 낮게 잡아 AOF 버퍼/오버헤드 여유를 남긴다. 둘은 같이 움직여야 한다.
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      # healthcheck의 redis-cli 인증용 (컨테이너 내부에서만 참조)
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    logging: *default-logging

  app:
    # VM에서 소스를 빌드하지 않는다. CI가 이미 검증하고 GHCR에 올린 이미지를 그대로 쓴다 —
    # VM 빌드는 (1) 되돌릴 태그가 남지 않아 롤백 경로가 없고, (2) Dockerfile이 bootJar -x test라
    # 운영에 나가는 바이너리가 테스트를 거치지 않으며, (3) 1GB 인스턴스에서는 Gradle이 뜨지도 않는다.
    # 롤백: .env.prod의 APP_VERSION을 이전 커밋 SHA로 바꾸고 `up -d`.
    #
    # 롤백 전 확인 두 가지:
    #  (1) 되돌릴 SHA가 지금 DB 스키마와 맞는가. ddl-auto=validate라 스키마가 앞서 있으면
    #      옛 이미지는 기동 검증에서 실패하고 restart 루프에 빠진다. 특히 V5는
    #      naver_place_id를 kakao_place_id로 RENAME해 버려서, V5 이전 이미지로는
    #      **이미지 교체만으로 되돌아가지 않는다**(컬럼 수동 복구 + flyway_schema_history
    #      정리가 필요하다). 스키마를 바꾸는 마이그레이션은 앞으로 expand/contract로 나눈다.
    #  (2) app이 재생성되면 컨테이너 IP가 바뀐다. web(nginx)이 옛 IP를 캐시하지 않도록
    #      frontend/nginx.conf가 resolver + 변수 업스트림을 쓰고 있어야 한다.
    image: ghcr.io/nameless0422/menupick:${APP_VERSION:?APP_VERSION must be set (커밋 SHA 또는 latest)}
    container_name: menupick-app
    restart: unless-stopped
    depends_on:
      # 단순 depends_on은 "컨테이너가 시작됐다"까지만 보장한다. 앱은 기동 시 Flyway 마이그레이션으로
      # 곧장 DB에 붙으므로, DB가 아직 초기화 중이면 기동 실패 → restart 루프에 빠진다.
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 리버스 프록시(nginx/caddy)가 TLS를 종단하고 이 포트로 넘기는 구성 전제.
      # "8080:8080"은 0.0.0.0 바인딩이라 프록시를 우회한 평문 HTTP 접근이 열린다.
      - "127.0.0.1:8080:8080"
      # 관리 포트(MANAGEMENT_SERVER_PORT)는 일부러 여기 없다. 그 포트는 인증을 요구하지 않으므로
      # (이유는 application-prod.yml의 management 주석) 닿을 수 있는 곳에 올리는 순간 metrics가
      # 그대로 읽힌다. 컨테이너 루프백 바인딩이라 publish하지 않으면 밖에서 연결 자체가 안 된다.
      # 운영자는 컨테이너 안에서 본다:
      #   docker exec menupick-app curl -s localhost:9090/actuator/metrics
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # actuator를 서비스 포트에서 분리한다. Dockerfile의 HEALTHCHECK가 같은 값을 읽으므로
      # 여기만 바꿔도 헬스체크가 따라온다.
      MANAGEMENT_SERVER_PORT: 9090
      # connectTimeout/socketTimeout: MySQL 커넥터의 기본값은 둘 다 0 = 무한이다.
      # application-prod.yml의 hikari.connection-timeout(5초)은 "풀에서 커넥션을 꺼내는" 시간만
      # 제한하지, 이미 빌려간 커넥션 위에서 도는 쿼리는 전혀 보호하지 않는다.
      # 그래서 MySQL이 응답을 멈추면(락 대기, 디스크 포화, OOMKill 직전 등) 풀의 커넥션 10개가
      # 영원히 잠긴 채 남고, 앱을 재시작하기 전까지 자력으로 회복되지 않는다.
      # socketTimeout=15000은 이 앱의 정상 쿼리(단건 조회·짧은 목록, 수십 ms)보다 압도적으로 길어
      # 오탐이 없으면서, 응답 없는 커넥션은 예외로 끊어 풀에 돌려보낸다.
      # connectTimeout=5000은 hikari.connection-timeout과 같은 값 — TCP 연결 수립 단계에서
      # 커넥션 획득 상한보다 오래 매달릴 이유가 없다.
      DB_URL: jdbc:mysql://mysql:3306/menupick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=15000
      # Flyway 전용. socketTimeout이 런타임보다 훨씬 길다 — 이유는 application-prod.yml의
      # spring.flyway 주석 참고(15초 상한이 DDL에 걸리면 부분 적용된 스키마가 남는다).
      # 10분은 "이보다 오래 걸리는 마이그레이션은 무중단 도구(gh-ost 등)로 따로 돌려야 한다"는 선이다.
      DB_MIGRATION_URL: jdbc:mysql://mysql:3306/menupick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=600000
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_TRUST_PROXY: "true"
      # 프록시 홉 수. 여기 없으면 .env.prod에 적어도 컨테이너에 전달되지 않는다 —
      # compose의 environment는 명시한 키만 넘기고, 앱은 기본값 1로 굳는다.
      # 값이 실제 토폴로지보다 작으면 XFF 오른쪽 N번째가 클라이언트가 아니라 프록시 IP라
      # 전 사용자가 버킷 하나를 공유하고 인증 경로가 분당 10회에서 429로 막힌다.
      # web(nginx) 한 겹만 앞에 있으면 1, TLS 종단 프록시가 더 있으면 2 이상.
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      NAVER_MAPS_CLIENT_ID: ${NAVER_MAPS_CLIENT_ID}
      NAVER_MAPS_CLIENT_SECRET: ${NAVER_MAPS_CLIENT_SECRET}
      # 지도 API 게이트웨이 도메인. 네이버가 신규 도메인(maps.apigw.ntruss.com)을 안내한
      # 이력이 있어, 이전이 실제로 일어났을 때 재빌드 없이 바꾸고 되돌릴 수 있도록 열어 둔다(#76).
      # 여기 기본값은 application-prod.yml의 기본값과 같아야 한다 — compose의 environment는
      # 명시한 키만 넘기고, 빈 값을 넘기면 yml의 기본값이 아니라 빈 문자열이 이긴다.
      NAVER_MAPS_GEOCODE_URL: ${NAVER_MAPS_GEOCODE_URL:-https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode}
      NAVER_MAPS_REVERSE_GEOCODE_URL: ${NAVER_MAPS_REVERSE_GEOCODE_URL:-https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      # 자체 계정의 메일 인증·비밀번호 재설정 발송. prod 프로파일은 이 값들에 기본값을 두지 않아,
      # 빠지면 기동 시점에 실패한다 — 조용히 뜨면 가입자가 인증 메일을 영영 못 받는다.
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_BASE_URL: ${MAIL_BASE_URL}
    # SIGTERM 후 SIGKILL까지의 유예. Docker 기본값은 10초라, 그대로 두면 앱이 정리를 끝내기 전에
    # 매번 SIGKILL로 죽는다(정지 시 app만 exit code 137로 남는 것이 그 증거다).
    # 그러면 두 가지 설정이 통째로 무효가 된다:
    #   - server.shutdown: graceful + spring.lifecycle.timeout-per-shutdown-phase: 25s
    #   - MailAsyncConfig의 awaitTerminationSeconds(20) — 큐에 남은 인증 메일을 마저 보내려는 대기
    # 40초인 이유: graceful 25초와 메일 대기 20초는 순차가 아니라 겹쳐 돌지만, 종료 단계는
    # 컨텍스트 정리·풀 종료가 뒤따르므로 둘 중 큰 값에 그만큼의 여유를 더한다.
    # 불변 조건은 하나다 — 이 값은 위 두 값(특히 awaitTerminationSeconds)보다 반드시 커야 한다.
    # 어느 쪽을 조정하든 함께 움직일 것. 작으면 "메일을 버리지 않겠다"는 결정이 조용히 되돌려진다.
    stop_grace_period: 40s
    # JVM 힙은 Dockerfile의 -XX:MaxRAMPercentage=75.0에 따라 이 한도의 75%(≈1.1GB)로 잡힌다.
    # 나머지 25%는 메타스페이스·스레드 스택(톰캣 50 스레드)·네트워크 버퍼 몫이다.
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    logging: *default-logging

  web:
    # SPA 정적 서빙 + /api 리버스 프록시. 프론트와 API가 같은 오리진이 되므로
    # refresh 쿠키(SameSite=Strict)가 정상 동작하고 CORS가 필요 없어진다.
    build:
      context: ./frontend
      args:
        # 같은 오리진이라 API 주소는 상대경로로 둔다.
        # OAuth 값은 넘기지 않는다 — 인가 URL은 백엔드가 조립한다(frontend/Dockerfile 참고).
        VITE_API_BASE_URL: ""
        # 카카오맵 JS 키. app의 KAKAO_REST_API_KEY와 다른 값이며, 이건 번들에 구워져
        # 공개되는 것이 정상이다(카카오 콘솔의 사이트 도메인 화이트리스트가 보호).
        # :- 기본값이 빈 문자열이라 .env.prod에 없어도 배포는 그대로 되고,
        # 그때는 지도 자리에 안내만 뜬다 — 지도 때문에 앱이 안 뜨는 일은 없어야 한다.
        VITE_KAKAO_JS_KEY: "${VITE_KAKAO_JS_KEY:-}"
    container_name: menupick-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
