spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url/username/password는 AbstractIntegrationTest가 Testcontainers MySQL로 동적 주입한다

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # 테스트 전용 더미 시크릿(무작위 생성). 운영/개발 어디에서도 쓰이지 않는다.
  secret: kueW5yj9MMeBUNKudwtsbMWNxEt9ubFf6BUdyghuENq0U85EY3Pcd19oIylxl8
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

kakao:
  local:
    rest-api-key: test-kakao-rest-api-key
    keyword-search-base-url: http://localhost:0/v2/local/search/keyword.json
    category-search-base-url: http://localhost:0/v2/local/search/category.json

logging:
  level:
    com.nameless0422.MenuPick: DEBUG
