spring:
  application:
    name: MenuPick

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true

# 기본은 비노출. local(또는 향후 dev) 프로파일에서만 true로 덮어써 노출한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 기본은 빈 목록 — 프론트 오리진은 프로파일별로 명시한다 (fail-safe: 안 정해주면 CORS가 전부 막힘)
cors:
  allowed-origins: []

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      # 헬스체크는 SecurityConfig에서 permitAll이므로, 비인증 호출자에게 DB/Redis 커넥션 상세를 노출하지 않는다.
      show-details: never
