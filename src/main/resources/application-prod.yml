# 운영 환경. springdoc/swagger는 여기서 별도로 열지 않는다 — application.yml 기본값(false)을
# 그대로 물려받는 게 의도된 동작이다 (docs/DecisionLog.md D-021, fail-safe 기본값).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 단일 VM(앱·MySQL·Redis 한 대) 전제. 커넥션 풀은 "동시에 DB를 때리는 스레드 수"의 상한이지
      # 처리량 손잡이가 아니다 — MySQL max_connections(기본 151)와 VM 코어 수를 감안해 10으로 고정한다.
      # 톰캣 스레드 50 > 풀 10 이므로, DB가 느려져도 초과 요청은 커넥션 대기 큐에서 막히고
      # DB를 커넥션 폭주로 밀어버리지 않는다.
      maximum-pool-size: 10
      # 커넥션을 5초 안에 못 받으면 실패시킨다. 무한정 매달려 톰캣 스레드를 전부 잠그는 것보다
      # 빠르게 503/500을 내고 스레드를 반납하는 편이 전체 가용성에 낫다.
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  # 메일 인증·비밀번호 재설정 발송. 기본값을 두지 않아 설정이 빠지면 기동 시점에 드러난다 —
  # 조용히 뜨면 가입한 사용자가 인증 메일을 영영 못 받고, 그 사실이 문의로만 알려진다.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Jakarta Mail의 타임아웃 기본값은 셋 다 "무한"이다. SMTP 서버가 응답을 멈추면
          # 발송 스레드가 영원히 돌아오지 않는데, 그 대가가 두 겹이다.
          #  1) 발송은 전용 풀(MailAsyncConfig, 최대 4스레드)에서 일어난다. 4개가 전부 잠기면
          #     이후 모든 인증·재설정 메일이 큐에 쌓이다 멈춘다 — 신규 가입이 통째로 막힌다.
          #  2) 그 큐(100)까지 차면 CallerRunsPolicy가 발송을 요청 스레드로 되돌린다.
          #     즉 최악의 경우 톰캣 스레드 50개까지 번져 메일과 무관한 요청도 멎는다.
          # 연결 5초는 SecurityConfig.webClient()의 연결 타임아웃과 같은 값이다.
          # 응답·쓰기 10초는 외부 JSON 호출(KakaoLocalClient·NaverMapsClient의 3초)보다 넉넉한데,
          # SMTP는 EHLO·STARTTLS·AUTH·DATA로 왕복이 여러 번인 대화형 프로토콜이라 같은 잣대를 쓰면
          # 정상 발송이 끊긴다.
          connectiontimeout: 5000   # TCP 연결 수립까지
          timeout: 10000            # 각 SMTP 응답 대기
          writetimeout: 10000       # 본문 쓰기(소켓 write) 대기

server:
  tomcat:
    threads:
      # 단일 VM 전제. 기본값 200은 이 규모에서 컨텍스트 스위칭·메모리만 늘리고,
      # 외부 API가 느려질 때 200개 스레드가 전부 대기하며 힙을 잠식한다.
      # 외부 API 호출 타임아웃(3s)·풀 크기(10)와 맞춰 50으로 제한한다.
      max: 50

management:
  endpoints:
    web:
      exposure:
        # 운영은 health만 노출. metrics/prometheus는 인증 없이 열려 있으면 내부 구조·트래픽 패턴이
        # 그대로 새어나가므로, 모니터링 도입 시 management.server.port로 관리 포트를 분리하고
        # 그 포트에서만 재개방한다 (이슈 #18).
        include: health

rate-limit:
  trust-proxy: ${RATE_LIMIT_TRUST_PROXY:true}
  # 앱 앞단에 있는 "신뢰할 수 있는" 프록시/LB 개수.
  # X-Forwarded-For는 각 프록시가 자신이 본 원격 주소를 오른쪽에 덧붙이므로,
  # 왼쪽 항목은 클라이언트가 위조할 수 있다(첫 항목을 쓰면 헤더 한 줄로 레이트 리밋이 뚫린다).
  # 오른쪽에서 이 홉 수만큼 들어간 항목만 신뢰한다. 실제 토폴로지와 반드시 일치시킬 것.
  trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
  # 인증 경로(IP 기준) / 외부 API 프록시 경로(사용자 기준) 분당 허용 횟수
  auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  proxy-limit-per-minute: ${RATE_LIMIT_PROXY_PER_MINUTE:30}

cors:
  allowed-origins: ${FRONTEND_ORIGIN}

app:
  mail:
    # SMTP 제공자가 인증한 도메인이어야 한다. 아니면 수신함이 아니라 스팸함으로 간다.
    from: ${MAIL_FROM}
    # 메일 링크의 목적지. 요청 Host 헤더로 유추하지 않는다 — 위조 가능해서 인증 링크를
    # 공격자 도메인으로 돌릴 수 있다.
    base-url: ${MAIL_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: ${GOOGLE_REDIRECT_URI}

kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY}
    keyword-search-base-url: https://dapi.kakao.com/v2/local/search/keyword.json
    category-search-base-url: https://dapi.kakao.com/v2/local/search/category.json

naver:
  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}
    geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode
    reverse-geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc

logging:
  level:
    com.nameless0422.MenuPick: INFO
