# 운영 환경. springdoc/swagger는 여기서 별도로 열지 않는다 — application.yml 기본값(false)을
# 그대로 물려받는 게 의도된 동작이다 (docs/DecisionLog.md D-021, fail-safe 기본값).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 단일 VM(앱·MySQL·Redis 한 대) 전제. 커넥션 풀은 "동시에 DB를 때리는 스레드 수"의 상한이지
      # 처리량 손잡이가 아니다 — MySQL max_connections(기본 151)와 VM 코어 수를 감안해 10으로 고정한다.
      # 톰캣 스레드 50 > 풀 10 이므로, DB가 느려져도 초과 요청은 커넥션 대기 큐에서 막히고
      # DB를 커넥션 폭주로 밀어버리지 않는다.
      maximum-pool-size: 10
      # 커넥션을 5초 안에 못 받으면 실패시킨다. 무한정 매달려 톰캣 스레드를 전부 잠그는 것보다
      # 빠르게 503/500을 내고 스레드를 반납하는 편이 전체 가용성에 낫다.
      # 주의: 이 값은 "풀에서 커넥션을 꺼내는" 시간만 제한한다. 이미 빌려간 커넥션에서 도는 쿼리는
      # 여기서 보호되지 않으므로, 쿼리 자체의 상한은 DB_URL의 socketTimeout이 맡는다
      # (docker-compose.prod.yml의 DB_URL 참고). 둘 중 하나만 있으면 구멍이 남는다.
      connection-timeout: 5000
      # 커넥션의 최대 수명. MySQL은 wait_timeout(기본 28800초=8시간)이 지난 유휴 커넥션을 서버 쪽에서
      # 말없이 끊는데, 풀은 그 사실을 모른 채 죽은 커넥션을 빌려주고 첫 쿼리가 통신 오류로 터진다.
      # 반드시 wait_timeout보다 짧아야 하며, 15분은 그 기본값은 물론 운영자가 값을 크게 줄여도
      # 여유가 남는 선이다. 방화벽/NAT가 유휴 TCP 세션을 끊는 경우도 같은 방식으로 흡수된다.
      max-lifetime: 900000
      # 20초 넘게 반납되지 않은 커넥션을 스택 트레이스와 함께 경고 로그로 남긴다.
      # 풀이 10개뿐이라 커넥션 누수나 장기 쿼리는 곧장 전면 장애가 되는데, 이 설정이 없으면
      # "느려졌다"는 현상만 보이고 어느 코드가 붙잡고 있는지가 로그에 한 줄도 남지 않는다.
      # 정상 쿼리보다 훨씬 길고 socketTimeout(15초)보다는 뒤에 오도록 20초로 잡아,
      # 소켓 타임아웃으로 끝날 일에는 울리지 않고 진짜 반납 누락만 걸러낸다.
      leak-detection-threshold: 20000

  flyway:
    # 마이그레이션은 앱 커넥션과 분리한다.
    #
    # spring.datasource의 DB_URL에는 socketTimeout=15s가 걸려 있다 — 런타임 쿼리가 무한정
    # 매달려 커넥션 10개를 영구히 잠그는 것을 막기 위한 값이다. 그런데 그 상한이 DDL에도
    # 그대로 적용되면, 데이터가 쌓인 뒤 큰 테이블에 인덱스를 추가하는 마이그레이션이 15초에서
    # 잘린다. 이때 MySQL 커넥터는 소켓만 끊고 서버는 ALTER를 계속 실행하며, MySQL은 DDL
    # 트랜잭션이 없어 롤백도 되지 않는다 — 부분 적용된 스키마와 failed로 마킹된 Flyway 이력만
    # 남아 앱이 영영 기동하지 못하는 상태가 된다. 런타임 상한과 마이그레이션 상한은 애초에
    # 다른 값이어야 하는 것이다.
    #
    # url을 주면 Flyway가 자체 DataSource를 만들어 쓰고 마이그레이션이 끝나면 닫는다.
    # 기본값을 DB_URL로 둬, 변수를 안 넘기는 환경(로컬 override 등)에서도 동작은 그대로다.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  # 메일 인증·비밀번호 재설정 발송. 기본값을 두지 않아 설정이 빠지면 기동 시점에 드러난다 —
  # 조용히 뜨면 가입한 사용자가 인증 메일을 영영 못 받고, 그 사실이 문의로만 알려진다.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Jakarta Mail의 타임아웃 기본값은 셋 다 "무한"이다. SMTP 서버가 응답을 멈추면
          # 발송 스레드가 영원히 돌아오지 않는데, 그 대가가 두 겹이다.
          #  1) 발송은 전용 풀(MailAsyncConfig, 최대 4스레드)에서 일어난다. 4개가 전부 잠기면
          #     이후 모든 인증·재설정 메일이 큐에 쌓이다 멈춘다 — 신규 가입이 통째로 막힌다.
          #  2) 그 큐(100)까지 차면 CallerRunsPolicy가 발송을 요청 스레드로 되돌린다.
          #     즉 최악의 경우 톰캣 스레드 50개까지 번져 메일과 무관한 요청도 멎는다.
          # 연결 5초는 SecurityConfig.webClient()의 연결 타임아웃과 같은 값이다.
          # 응답·쓰기 10초는 외부 JSON 호출(KakaoLocalClient·NaverMapsClient의 3초)보다 넉넉한데,
          # SMTP는 EHLO·STARTTLS·AUTH·DATA로 왕복이 여러 번인 대화형 프로토콜이라 같은 잣대를 쓰면
          # 정상 발송이 끊긴다.
          connectiontimeout: 5000   # TCP 연결 수립까지
          timeout: 10000            # 각 SMTP 응답 대기
          writetimeout: 10000       # 본문 쓰기(소켓 write) 대기

server:
  tomcat:
    threads:
      # 단일 VM 전제. 기본값 200은 이 규모에서 컨텍스트 스위칭·메모리만 늘리고,
      # 외부 API가 느려질 때 200개 스레드가 전부 대기하며 힙을 잠식한다.
      # 외부 API 호출 타임아웃(3s)·풀 크기(10)와 맞춰 50으로 제한한다.
      max: 50

management:
  # 관리 엔드포인트를 서비스 포트(8080)에서 떼어내 별도 포트로 옮긴다.
  # 8080은 리버스 프록시를 거쳐 인터넷에 닿는 포트다. metrics는 커넥션 풀 점유·요청량·JVM 힙처럼
  # 내부 구조와 트래픽 패턴을 그대로 드러내므로 그 포트에 두면 안 된다.
  #
  # 이 포트는 인증을 요구하지 않는다. 시큐리티 체인 자체는 관리 포트에도 걸리지만
  # (ManagementPortIntegrationTest가 확인한다), SecurityConfig가 이 포트만 permitAll로 뺀다 —
  # 운영자가 metrics를 보려고 Access Token을 들고 다닐 방법이 없기 때문이다(D-026: AT는 브라우저
  # 메모리에만 있고 30분이면 만료된다). 그래서 "누가 인증했나"가 아니라 "애초에 닿을 수 없게" 막는다:
  #   1) address: 127.0.0.1 — 컨테이너 내부 루프백에만 바인딩. compose에서 실수로 publish해도
  #      컨테이너 밖에서는 연결 자체가 안 된다.
  #   2) docker-compose.prod.yml이 이 포트를 publish하지 않는다.
  # 한 겹이 뚫려도 나머지 한 겹이 남도록 둘 다 건다.
  #
  # 운영자는 컨테이너 안에서 본다:
  #   docker exec menupick-app curl -s localhost:9090/actuator/metrics
  #   docker exec menupick-app curl -s "localhost:9090/actuator/metrics/hikaricp.connections.pending"
  #
  # 나중에 같은 compose 망에 Prometheus를 올린다면 address를 지워(전체 인터페이스 바인딩) 컨테이너
  # 간 스크레이프를 허용하되, publish는 계속 하지 않는 방향이다.
  server:
    # Dockerfile의 HEALTHCHECK도 같은 환경변수를 읽는다. 한쪽만 바꾸면 헬스체크가 실패해
    # 컨테이너가 unhealthy로 드러난다 — 조용히 어긋나지 않는다.
    port: ${MANAGEMENT_SERVER_PORT:9090}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 서비스 포트에서 분리했으니 metrics를 다시 연다. 이 앱에서 실제로 보게 될 지표:
        #   hikaricp.connections.pending  — 커넥션 풀(10) 고갈. 톰캣 스레드가 DB 대기로 잠기는 신호
        #   executor.queued{name=mailTaskExecutor} — 메일 큐(100) 적체. 차면 발송이 요청 스레드로 넘어온다
        #   jvm.memory.used{area=heap}    — mem_limit 1536m의 75%가 힙 상한
        include: health, metrics

rate-limit:
  trust-proxy: ${RATE_LIMIT_TRUST_PROXY:true}
  # 앱 앞단에 있는 "신뢰할 수 있는" 프록시/LB 개수.
  # X-Forwarded-For는 각 프록시가 자신이 본 원격 주소를 오른쪽에 덧붙이므로,
  # 왼쪽 항목은 클라이언트가 위조할 수 있다(첫 항목을 쓰면 헤더 한 줄로 레이트 리밋이 뚫린다).
  # 오른쪽에서 이 홉 수만큼 들어간 항목만 신뢰한다. 실제 토폴로지와 반드시 일치시킬 것.
  trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
  # 인증 경로(IP 기준) / 외부 API 프록시 경로(사용자 기준) 분당 허용 횟수
  auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  proxy-limit-per-minute: ${RATE_LIMIT_PROXY_PER_MINUTE:30}

cors:
  allowed-origins: ${FRONTEND_ORIGIN}

app:
  mail:
    # SMTP 제공자가 인증한 도메인이어야 한다. 아니면 수신함이 아니라 스팸함으로 간다.
    from: ${MAIL_FROM}
    # 메일 링크의 목적지. 요청 Host 헤더로 유추하지 않는다 — 위조 가능해서 인증 링크를
    # 공격자 도메인으로 돌릴 수 있다.
    base-url: ${MAIL_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: ${GOOGLE_REDIRECT_URI}

kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY}
    keyword-search-base-url: https://dapi.kakao.com/v2/local/search/keyword.json
    category-search-base-url: https://dapi.kakao.com/v2/local/search/category.json

naver:
  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}
    geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode
    reverse-geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc

logging:
  level:
    com.nameless0422.MenuPick: INFO
