spring:
  datasource:
    url: jdbc:h2:mem:menupick-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm!!
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

logging:
  level:
    com.nameless0422.MenuPick: DEBUG
