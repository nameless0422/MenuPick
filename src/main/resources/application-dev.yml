# 팀/스테이징 공유 환경. local(docker-compose, 개인 머신)과 달리 실제 호스트를 env로 주입받는다.
# 모든 값이 기본값 없는 ${VAR} 형태 — 설정 누락 시 조용히 뜨는 대신 기동 실패로 즉시 드러나게 한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 운영(prod)과 동일 값 — 스테이징에서 풀 고갈/타임아웃 거동을 운영과 같은 조건으로 관찰하기 위함.
      # 근거는 application-prod.yml 주석 참고 (단일 VM 전제).
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  # 메일 인증·비밀번호 재설정 발송. MAIL_HOST를 주지 않으면 JavaMailSender가 만들어지지 않고
  # 링크가 로그로만 남는다 — 스테이징에서 SMTP 없이 흐름만 확인할 때를 위한 기본값이다.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Jakarta Mail의 타임아웃 기본값은 셋 다 "무한"이다. 근거는 application-prod.yml의
          # 같은 자리에 적어 뒀다 — 발송 풀이 잠기고, 큐가 차면 요청 스레드까지 번진다.
          # 값도 운영과 동일하게 둬 스테이징에서 같은 조건으로 거동을 관찰한다.
          connectiontimeout: 5000   # TCP 연결 수립까지
          timeout: 10000            # 각 SMTP 응답 대기
          writetimeout: 10000       # 본문 쓰기(소켓 write) 대기

server:
  tomcat:
    threads:
      # prod와 동일 (단일 VM 전제). 근거는 application-prod.yml 주석 참고.
      max: 50

rate-limit:
  # dev는 로드밸런서/리버스 프록시 뒤에 있다고 가정 (local과의 차이점)
  trust-proxy: ${RATE_LIMIT_TRUST_PROXY:true}
  # 앱 앞단에 있는 "신뢰할 수 있는" 프록시/LB 개수.
  # X-Forwarded-For는 각 프록시가 자신이 본 원격 주소를 오른쪽에 덧붙이므로,
  # 왼쪽 항목은 클라이언트가 위조할 수 있다. 오른쪽에서 이 홉 수만큼 들어간 항목만 신뢰한다.
  # 실제 토폴로지와 반드시 일치시킬 것 — 크게 잡으면 프록시 IP 하나로 전 사용자가 묶인다.
  trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
  # 인증 경로(IP 기준) / 외부 API 프록시 경로(사용자 기준) 분당 허용 횟수
  auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  proxy-limit-per-minute: ${RATE_LIMIT_PROXY_PER_MINUTE:30}

cors:
  # 쉼표로 여러 오리진 지정 가능 (예: https://dev.menupick.com,https://admin-dev.menupick.com)
  allowed-origins: ${FRONTEND_ORIGIN}

app:
  mail:
    from: ${MAIL_FROM:no-reply@menupick.local}
    # 메일 링크의 목적지. 요청 Host 헤더로 유추하지 않는다 — 위조 가능해서 인증 링크를
    # 공격자 도메인으로 돌릴 수 있다. FRONTEND_ORIGIN에 여러 오리진을 넣는 경우가 있어
    # 그 값을 그대로 쓰지 않고 별도 변수로 받는다.
    base-url: ${MAIL_BASE_URL}

springdoc:
  # local과 동일하게 dev도 API 문서 노출 (팀 협업용)
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: ${GOOGLE_REDIRECT_URI}

kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY}
    keyword-search-base-url: https://dapi.kakao.com/v2/local/search/keyword.json
    category-search-base-url: https://dapi.kakao.com/v2/local/search/category.json

naver:
  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}
    # 게이트웨이 도메인을 코드 변경·재빌드 없이 바꾸고 되돌릴 수 있게 env로 노출한다.
    # 네이버가 신규 도메인(maps.apigw.ntruss.com)을 안내한 이력이 있으나, 공식 API 문서는
    # 2026-08 기준 여전히 아래 값을 기재하고 있어 기본값은 그대로 둔다. 운영 로그에
    # "네이버 Geocode API 응답 오류: status=401" 또는 404가 보이면 도메인 이전이 실제로
    # 일어난 것이므로, 두 env만 바꿔 재기동하면 된다(#76).
    geocode-base-url: ${NAVER_MAPS_GEOCODE_URL:https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode}
    reverse-geocode-base-url: ${NAVER_MAPS_REVERSE_GEOCODE_URL:https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc}

logging:
  level:
    com.nameless0422.MenuPick: DEBUG
