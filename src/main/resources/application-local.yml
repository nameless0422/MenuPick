spring:
  datasource:
    url: jdbc:mysql://localhost:3306/menupick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:menupick}
    password: ${DB_PASSWORD:menupick}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# SMTP를 지정하지 않는다. spring.mail.host가 없으면 Boot가 JavaMailSender를 만들지 않고,
# EmailSender가 인증·재설정 링크를 로그(WARN)로 떨어뜨린다. 로컬에서 메일 계정 없이
# 가입 → 인증 흐름을 끝까지 확인하기 위한 의도된 설정이다.
#
# 다만 이 경로는 메일을 "만들지도 보내지도" 않는다는 점에 주의할 것. 제목이 깨지거나 링크가
# 잘못 조립돼도 로그에서는 멀쩡해 보인다. 실제 발송까지 눈으로 보려면 docker-compose.yml의
# mailpit을 띄우고 아래를 주면 된다 — 받은 메일은 http://localhost:8025 에서 확인한다.
#
#   SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 ./gradlew bootRun
#
# 발송 경로 자체의 회귀는 SmtpDeliveryIntegrationTest가 실제 SMTP 소켓으로 고정한다.
app:
  mail:
    from: no-reply@menupick.local
    # 메일 링크가 향할 프론트엔드 주소 (Vite 개발 서버)
    base-url: http://localhost:5173
    # 발송하지 못한 메일의 본문을 로그에 남긴다 — 인증 링크를 눌러보기 위한 것.
    # 본문에는 인증·재설정 토큰이 그대로 들어 있으므로 로컬에서만 켠다.
    # dev/prod는 기본값 false를 그대로 둔다(설정 자체를 두지 않는다).
    log-links: true

rate-limit:
  trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}

cors:
  # Vite 기본 개발 서버 포트
  allowed-origins:
    - http://localhost:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

auth:
  cookie:
    # 로컬은 http라 secure 쿠키가 전송되지 않으므로 false. 운영 기본값은 true.
    secure: ${AUTH_COOKIE_SECURE:false}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    keyword-search-base-url: https://dapi.kakao.com/v2/local/search/keyword.json
    category-search-base-url: https://dapi.kakao.com/v2/local/search/category.json

naver:
  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID:}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET:}
    geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode
    reverse-geocode-base-url: https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc

logging:
  level:
    com.nameless0422.MenuPick: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
