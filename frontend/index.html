<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 본문 IBM Plex Sans KR, 간판 글씨 Black Han Sans, 숫자·시각 IBM Plex Mono.
         구글 폰트는 한글을 유니코드 범위별로 쪼개 배포하므로 실제로 화면에 뜬 글자가
         속한 조각만 내려온다. display=swap이라 폰트가 늦거나 아예 막혀도(사내망·차단)
         index.css의 폴백 스택으로 그려질 뿐 화면이 비지 않는다.
         preconnect가 없으면 CSS를 받은 뒤에야 gstatic 연결을 시작해 첫 글자가 한 박자
         늦는다. 폰트 파일은 크로스오리진이라 crossorigin 속성이 있어야 그 연결이 재사용된다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>메뉴픽</title>
    <!-- 공유 링크 미리보기. 카카오톡·슬랙 등은 페이지를 받아 이 태그들을 읽는다.
         이 앱은 SPA라 경로별로 태그를 바꿀 수 없으므로(서버 렌더링이 없다) 서비스 소개 한 벌만 둔다 —
         뽑힌 메뉴 이름까지 미리보기에 넣으려면 서버 렌더링이나 별도 공유 페이지가 필요하다.
         og:image는 넣지 않았다. 없는 이미지 경로를 가리키면 미리보기가 깨진 칸으로 나온다. -->
    <meta name="description" content="오늘 뭐 먹지? 내 메뉴 목록에서 골라주는 점심 추천 — 메뉴픽" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="메뉴픽" />
    <meta property="og:title" content="메뉴픽 — 오늘 뭐 먹지" />
    <meta property="og:description" content="내가 등록한 메뉴 중에서 오늘 먹을 것을 골라줍니다. 가입 없이 한 번 뽑아볼 수 있어요." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
