# SPA 정적 서빙 + API 리버스 프록시.
#
# 프론트와 API를 같은 오리진에 둔다. 이유는 편의가 아니라 refresh 쿠키다 —
# 쿠키가 SameSite=Strict라(AuthController.refreshCookieBuilder) 등록가능도메인이
# 다르면 브라우저가 아예 싣지 않아 /auth/refresh가 항상 401이 된다. 같은 오리진이면
# CORS 자체가 불필요해지고, VITE_API_BASE_URL도 빈 값(상대경로)으로 둘 수 있다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시 뒤 실제 IP. RATE_LIMIT_TRUST_PROXY=true + trustedProxyHops=1이
    # "오른쪽에서 1번째"를 클라이언트로 보므로, 여기서 정확히 한 홉을 덧붙여야 한다.
    # 이 헤더를 안 넣으면 전 사용자가 프록시 IP 하나의 버킷을 공유해 분당 10회에서
    # 인증 경로 전체가 429가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # 업스트림이 죽었을 때 브라우저를 무한히 잡아두지 않는다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 해시가 박힌 번들만 장기 캐시한다. index.html을 캐시하면 배포해도
    # 사용자가 옛 번들을 계속 받는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback. 이게 없으면 /menus에서 새로고침할 때 404다 —
    # App.tsx의 "*" 라우트는 클라이언트 라우터 안에서만 동작한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
