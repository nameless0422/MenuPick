# SPA 정적 서빙 + API 리버스 프록시.
#
# 프론트와 API를 같은 오리진에 둔다. 이유는 편의가 아니라 refresh 쿠키다 —
# 쿠키가 SameSite=Strict라(AuthController.refreshCookieBuilder) 등록가능도메인이
# 다르면 브라우저가 아예 싣지 않아 /auth/refresh가 항상 401이 된다. 같은 오리진이면
# CORS 자체가 불필요해지고, VITE_API_BASE_URL도 빈 값(상대경로)으로 둘 수 있다.

# 메일 인증·비밀번호 재설정 링크는 토큰을 쿼리에 싣는다(AuthMailer). 기본 combined 형식은 요청
# 줄과 Referer를 그대로 남겨 일회용 토큰이 접근 로그에 쌓이므로, 쿼리를 뺀 경로만 기록한다.
# $uri는 try_files 뒤 /index.html로 바뀌어 원래 경로를 잃으므로 $request_uri에서 잘라 쓴다.
map $request_uri $menupick_request_path {
    default              "-";
    "~^(?<path>[^?]*)"   $path;
}

log_format menupick_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $menupick_request_path $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # http 레벨 access_log는 기본 nginx.conf의 combined에 더해져 양쪽에 기록된다.
    # server 레벨에 두어야 상속을 덮어써 토큰이 든 형식이 남지 않는다.
    access_log /var/log/nginx/access.log menupick_safe;

    # 브라우저 기본값은 같은 오리진 API 호출에 전체 URL을 실어, 인증 링크의 토큰이 upstream
    # 장애 때 error_log의 referrer로 남는다(실측). 다른 오리진에는 지금처럼 오리진만 가므로
    # 카카오 JS 키의 도메인 화이트리스트에는 영향이 없다. add_header는 상속이 아니라
    # 덮어쓰기라 자기 add_header가 있는 아래 location에도 다시 선언한다.
    add_header Referrer-Policy "strict-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시 뒤 실제 IP. RATE_LIMIT_TRUST_PROXY=true + trustedProxyHops=1이
    # "오른쪽에서 1번째"를 클라이언트로 보므로, 여기서 정확히 한 홉을 덧붙여야 한다.
    # 이 헤더를 안 넣으면 전 사용자가 프록시 IP 하나의 버킷을 공유해 분당 10회에서
    # 인증 경로 전체가 429가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # resolver + 변수 업스트림: proxy_pass에 호스트명을 리터럴로 쓰면 nginx가 설정 로드
    # 시점에 딱 한 번 DNS를 풀고 그 IP를 프로세스 수명 내내 캐시한다. compose에서
    # APP_VERSION을 바꿔 `up -d`하면 app은 재시작이 아니라 **재생성**되어 새 IP를 받는데,
    # web은 건드려지지 않으므로 옛 IP를 계속 두드려 /api가 통째로 502가 된다.
    # 즉 롤백 절차(docker-compose.prod.yml의 app 주석)를 그대로 따르면 장애가 하나 더 는다.
    # 변수를 끼우면 nginx가 요청마다 resolver에게 다시 묻는다. 127.0.0.11은 Docker 내장 DNS다.
    # ipv6=off: compose 네트워크는 IPv4뿐이라 AAAA 조회는 실패할 응답을 기다리는 시간일 뿐이다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback이 /.env, /.git 같은 스캔 경로에도 index.html을 200으로 돌려주지 않게 한다.
    # 현재 이미지에 비밀파일은 없지만, 숨김파일은 존재 여부와 무관하게 명시적으로 거부한다.
    location ~ /\. { return 404; }

    location /api/ {
        # URI 없이 변수만 쓰면 원본 요청 URI가 그대로 전달된다(리터럴 형태와 동일한 동작).
        set $upstream app;
        proxy_pass http://$upstream:8080;
        proxy_http_version 1.1;
        # 업스트림이 죽었을 때 브라우저를 무한히 잡아두지 않는다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 해시가 박힌 번들만 장기 캐시한다. index.html을 캐시하면 배포해도
    # 사용자가 옛 번들을 계속 받는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "strict-origin" always;
    }

    # SPA fallback. 이게 없으면 /menus에서 새로고침할 때 404다 —
    # App.tsx의 "*" 라우트는 클라이언트 라우터 안에서만 동작한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
