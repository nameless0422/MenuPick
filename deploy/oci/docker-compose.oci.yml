# 서버 전용 오버레이 — 리포에 커밋하지 않는다.
# 도메인/TLS가 아직 없는 HTTP 단독 배포와, SMTP 공급자 없이 메일 흐름을 확인하기 위한 설정.
services:
  # app: AUTH_COOKIE_SECURE 오버라이드를 제거했다(2026-08-28).
  # nginx-tls.conf의 :80이 이제 https로 301하므로 평문 경로가 없고, 운영 기본값
  # true(AuthCookieProperties)가 그대로 적용된다 — refresh 쿠키가 http로 나가지 않는다.

  mailpit:
    image: axllent/mailpit:latest
    container_name: menupick-mailpit
    restart: unless-stopped
    # Spring이 smtp.auth=true로 접속하므로 인증을 받아주되 아무 자격증명이나 통과시킨다.
    # 평문 허용이 필요한 이유는 STARTTLS 없이 붙기 때문이다. 개발용 캡처 전용 서버다.
    command: ["--smtp-auth-accept-any", "--smtp-auth-allow-insecure"]
    ports:
      # 웹 UI는 외부에 열지 않는다. 확인은 SSH 터널로 한다.
      - "127.0.0.1:8025:8025"
    mem_limit: 128m

  web:
    # 자체 서명 인증서로 HTTPS를 붙인다. 브라우저가 보안 컨텍스트에서만
    # navigator.geolocation을 허용해서, http로는 위치 권한 팝업조차 뜨지 않는다.
    # 설정과 인증서를 이미지에 굽지 않고 덮어씌우는 이유는 이게 테스트 전용이기
    # 때문이다 — 실제 도메인과 신뢰받는 인증서가 생기면 이 블록만 지우면 된다.
    ports:
      # 80은 docker-compose.prod.yml이 ${WEB_HTTP_BIND}로 직접 publish한다(issue #87 릴리스).
      # compose는 여러 파일의 ports를 덮어쓰지 않고 **이어 붙이므로**, 여기서 다시 선언하면
      # 같은 호스트 포트를 두 번 publish해 web 컨테이너가 기동에 실패한다.
      # 공개 여부는 .env의 WEB_HTTP_BIND로 정한다 — 이 서버의 :80은 리다이렉트가 아니라
      # 앱을 직접 서빙하므로 0.0.0.0이어야 기존 http 접속이 유지된다.
      - "443:443"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
