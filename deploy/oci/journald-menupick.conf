# /etc/systemd/journald.conf.d/menupick.conf 로 설치한다.
#
# 두 가지를 정한다.
#
# 1) **영구 보관.** 2026-10-02에 확인해 보니 `Storage=persistent`를 적어 둔 드롭인이
#    있는데도 450MB 전부가 /run/log/journal(tmpfs)에 있었다 — /var/log/journal은 0바이트.
#    설정을 넣은 뒤 journald를 다시 읽히지 않아 런타임 저장소를 계속 쓰고 있었던 것이다.
#    재부팅하면 그대로 사라지는 상태였다. 설치 절차에 `journalctl --flush`를 둔 이유다.
#
# 2) **상한.** 도커 컨테이너 로그가 json-file 대신 여기로 들어온다
#    (docker-compose.prod.yml의 x-logging). 앱 접근 로그가 요청마다 한 줄이라 양이
#    늘어나므로, 기존 200M로는 몇 시간치밖에 남지 않는다. 1G로 올리되 디스크가 먼저 차는
#    것을 막기 위해 KeepFree를 함께 둔다 — 루트가 이미 74% 차 있고
#    (30G 중 22G 사용) 가득 차면 MySQL이 먼저 죽는다.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=100M
