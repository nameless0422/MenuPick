# 서버 전용 nginx 설정 — 리포에 없다. 자체 서명 인증서를 쓰는 테스트용 구성이라
# 이미지에 굽지 않고 볼륨으로 덮어씌운다(docker-compose.oci.yml).
#
# HTTPS가 필요한 이유는 브라우저가 보안 컨텍스트(HTTPS 또는 localhost)에서만
# navigator.geolocation을 허용하기 때문이다. http로 열면 권한 팝업조차 뜨지 않는다.

# 공통 프록시/캐시 규칙을 두 server 블록이 함께 쓴다.
# nginx는 proxy_pass에 리터럴 호스트명을 쓰면 설정 로드 시점에 단 한 번만 DNS를
# 조회하고, 그 IP를 프로세스 수명 내내 캐시한다. compose가 app 컨테이너를
# 재생성하면(APP_VERSION 롤백이 바로 이 경우다) 새 IP를 받는데, nginx는 죽은
# 옛 IP로 계속 프록시해서 /api 전체가 502가 된다. 앱은 멀쩡한데 복구 절차
# 자체가 장애를 만드는 구조였다.
# 변수 업스트림 + resolver를 쓰면 요청마다 재조회한다. 127.0.0.11은 도커의
# 내장 DNS이고, ipv6=off는 AAAA 조회 실패로 인한 지연을 없앤다.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $ignored { default ""; }

# 컨테이너 내부 헬스체크(wget http://127.0.0.1/)만 리다이렉트에서 제외한다.
# 헬스체크는 이미지에 구워져 있어(frontend/Dockerfile) 서버 설정으로는 못 바꾸는데,
# 301을 따라가면 자체 서명 인증서 검증에서 실패해 web이 unhealthy가 된다.
# 이 서버 앞에는 프록시가 없으므로 외부 요청의 remote_addr이 루프백일 수 없다.
map $remote_addr $menupick_skip_redirect {
    default   0;
    127.0.0.1 1;
    ::1       1;
}

server {
    listen 80;
    server_tokens off;
    server_name _;

    # http로 온 요청은 전부 https로 보낸다.
    #
    # 예전에는 리다이렉트하지 않았고 그 근거도 적혀 있었다 — 자체 서명 인증서라
    # 브라우저가 막으면 돌아갈 곳이 없어진다는 것. 그 대가가 컸다: 이 블록이
    # /api/까지 평문으로 프록시해서 로그인 자격증명과 refresh 쿠키가 그대로 네트워크에
    # 노출됐다. 경고 화면은 사용자가 넘길 수 있지만 평문으로 나간 비밀번호는 되돌릴 수 없다.
    #
    # HSTS는 넣지 않는다. 자체 서명 상태에서 HSTS를 보내면 브라우저가 그 호스트를
    # 기억해 예외 통과 자체를 막아버려, 되돌릴 방법이 없는 잠금이 된다.
    # 실제 도메인과 신뢰받는 인증서가 붙은 뒤에 검토할 것.
    if ($menupick_skip_redirect = 0) {
        return 301 https://$host$request_uri;
    }

    # 아래는 루프백 헬스체크만 도달한다.
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    # 응답 헤더에서 nginx 버전을 뺀다. 버전이 붙어 있으면 스캐너가 그 버전의
    # 알려진 취약점만 골라 시도할 수 있다. 끄면 'nginx'까지만 남는다.
    server_tokens off;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # 백엔드가 원 프로토콜을 알아야 한다. 여기서 https로 넘어가야
    # 앱이 만드는 절대 URL이 http로 새지 않는다.
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 보안 헤더 ────────────────────────────────────────────────────────
    # 2026-09-11 점검에서 하나도 없다는 것이 드러나 넣는다. 스캐너는 이미 매일 오고 있고
    # (/.env 19회, /wp-config.php, /.git/config …) 지금은 전부 막히지만, 아래 셋은 "막는"
    # 것이 아니라 브라우저가 우리 페이지를 어떻게 다루는지를 정하는 값이라 성격이 다르다.
    #
    # always를 붙인다. 붙이지 않으면 2xx/3xx에만 실려 404·500 응답에는 빠지는데,
    # 그 응답들도 브라우저가 렌더링하는 문서다.
    #
    # HSTS는 일부러 넣지 않았다. 지금 접속 주소가 IP이고 HSTS는 호스트명에만 적용되어
    # 브라우저가 무시한다. 실제 도메인과 신뢰받는 인증서가 생기면 그때 함께 넣을 것.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 이 앱이 쓰는 브라우저 권한은 위치뿐이다(거리 필터). 나머지는 명시적으로 닫는다.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # CSP는 **강제하지 않고 보고만** 한다(Report-Only).
    #
    # 카카오 지도 SDK가 번들에는 안 보이는 CDN에서 타일과 추가 스크립트를 더 받아오기
    # 때문이다. 아래 목록은 index.html과 빌드 산출물에서 실제로 참조된 오리진
    # (dapi.kakao.com / fonts.googleapis.com / fonts.gstatic.com)에 카카오 지도가 쓰는
    # CDN을 더한 것이지만, 브라우저로 지도를 실제로 띄워 확인하기 전에 강제하면
    # 지도가 조용히 깨진다.
    #
    # **승격 방법**: 지도·픽·식당 검색을 한 번씩 돌려 보고 개발자 도구 콘솔에 CSP 위반이
    # 없으면, 아래 지시어 이름에서 `-Report-Only`만 떼면 된다.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.daumcdn.net https://*.kakaocdn.net; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA fallback에서 숨김파일 스캔 경로를 분리한다. 이미지에 .env가 없어도 200 index.html을
    # 반환하면 스캐너에게 애매한 성공 신호를 주므로 명시적으로 404 처리한다.
    location ~ /\. { return 404; }

    location /api/ {
        set $upstream app;
        proxy_pass http://$upstream:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
    # nginx의 add_header는 상속이 아니라 **덮어쓰기**다. 이 두 location이 자기 add_header를
    # 가지면 위에서 깐 보안 헤더가 그 경로에서만 통째로 사라진다 — index.html은 곧 문서
    # 본체라 가장 필요한 자리다. 그래서 여기서 다시 선언한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # 루트 `/` 요청도 try_files로 여기에 도달한다 — 즉 이 블록이 **사용자가 실제로 받는
    # 문서**의 헤더를 정한다. 위 server 블록에 적은 것을 하나라도 빠뜨리면 그 헤더는
    # 사이트 전체에서 사라진다(add_header는 상속이 아니라 덮어쓰기다).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.daumcdn.net https://*.kakaocdn.net; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
