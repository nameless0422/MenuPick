plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.nameless0422'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// 자체 계정의 메일 인증·비밀번호 재설정 발송.
	// JavaMailSender 자동설정은 spring.mail.host가 있을 때만 동작하므로, 호스트를 지정하지 않은
	// 로컬/테스트에서는 EmailSender가 링크를 로그로 떨어뜨린다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// API 문서 자동화 (docs/ImprovementBacklog.md 7번, /swagger-ui는 local 프로파일 한정 노출)
	// springdoc 2.x는 Spring Boot 3/Framework 6 라인이라 Boot 4에서는 기동 시점에 깨진다.
	// 3.0.3은 spring-boot-starter-parent 4.0.5(= 이 프로젝트의 Boot 버전)로 빌드된 릴리스다.
	// 3.1.x는 Boot 4.1 라인이므로 Boot를 올릴 때 함께 올린다. (이슈 #19)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// Argon2 비밀번호 해싱. Spring Security의 Argon2PasswordEncoder는 구현을 BouncyCastle의
	// Argon2BytesGenerator에 위임하므로, 이 의존성이 없으면 인코더 생성 시점에 NoClassDefFoundError가 난다.
	// Boot BOM이 관리하지 않는 의존성이라 버전을 직접 지정한다(jjwt·springdoc과 같은 처리).
	// 암호 라이브러리이므로 취약점 공지가 나면 우선 올릴 것.
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Flyway (Boot 4부터 자동설정이 spring-boot-flyway 모듈로 분리 — 없으면 마이그레이션이 아예 실행되지 않는다)
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// DB
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Testcontainers (실 MySQL + Flyway 기반 통합 테스트, docs/ImprovementBacklog.md 6번)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:mysql:1.21.4'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport

	// ComposePortExposureTest는 컴파일된 소스가 아니라 리포 루트의 compose 파일을 읽는다.
	// 입력으로 선언하지 않으면 compose만 고친 변경에서 test 태스크가 UP-TO-DATE로 건너뛰어,
	// 포트를 0.0.0.0으로 되돌려 놓고도 로컬에서는 초록불이 뜬다(실제로 그렇게 동작했다).
	inputs.files('docker-compose.prod.yml', 'docker-compose.yml')
			.withPropertyName('composeFiles')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	// 측정 대상에서 빼는 것들. 커버리지를 올리려고 이런 것까지 테스트하기 시작하면
	// 숫자만 오르고 회귀는 그대로 새어 나간다.
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				// DTO/응답 래퍼: record와 생성자뿐이라 검증할 분기가 없다.
				'**/dto/**',
				'**/common/dto/**',
				// 설정 클래스: 빈 배선이라 단위 테스트가 아니라 컨텍스트 로딩으로 확인된다.
				'**/config/**',
				// 부트 진입점.
				'**/MenuPickApplication.class',
			])
		}))
	}
}

/**
 * 커버리지 하한.
 *
 * 목표치가 아니라 <b>래칫</b>이다. 지금 실제로 나오는 수치보다 살짝 아래에 두어,
 * "여기서 더 내려가면 막는다"는 역할만 시킨다. 달성하지 못할 숫자를 걸어두면 CI가 상시
 * 빨간 상태가 되고, 그 상태에서는 진짜 회귀도 함께 무시된다.
 *
 * 분기(BRANCH)를 함께 보는 이유: 라인만 보면 예외 경로·경계 조건을 한 번도 타지 않고도
 * 수치가 채워진다. 이 프로젝트에서 실제로 위험한 코드는 대부분 그 분기 쪽에 있다.
 *
 * <p><b>2026-09-02 상향</b>: LINE 0.88 → 0.91, BRANCH 0.75 → 0.79.
 * D-030이 하한을 실측보다 3~5%p 아래로 잡되 "실측이 올라가도 하한은 자동으로 따라 오르지
 * 않는다. 큰 폭으로 벌어지면 사람이 올려야 한다"고 적어 뒀다. 당시 실측은 LINE 91.8% /
 * BRANCH 79.7%였고 지금은 94.5% / 82.7%다 — 격차가 6.5%p / 7.7%p로 벌어져 래칫이 사실상
 * 아무것도 막지 못하는 상태였다. 다시 3~4%p 아래로 당긴다.
 */
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.91
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.79
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(jacocoTestReport.classDirectories)
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
