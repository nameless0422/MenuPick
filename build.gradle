plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nameless0422'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// 자체 계정의 메일 인증·비밀번호 재설정 발송.
	// JavaMailSender 자동설정은 spring.mail.host가 있을 때만 동작하므로, 호스트를 지정하지 않은
	// 로컬/테스트에서는 EmailSender가 링크를 로그로 떨어뜨린다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// API 문서 자동화 (docs/ImprovementBacklog.md 7번, /swagger-ui는 local 프로파일 한정 노출)
	// springdoc 2.x는 Spring Boot 3/Framework 6 라인이라 Boot 4에서는 기동 시점에 깨진다.
	// 3.0.3은 spring-boot-starter-parent 4.0.5(= 이 프로젝트의 Boot 버전)로 빌드된 릴리스다.
	// 3.1.x는 Boot 4.1 라인이므로 Boot를 올릴 때 함께 올린다. (이슈 #19)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Flyway (Boot 4부터 자동설정이 spring-boot-flyway 모듈로 분리 — 없으면 마이그레이션이 아예 실행되지 않는다)
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// DB
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Testcontainers (실 MySQL + Flyway 기반 통합 테스트, docs/ImprovementBacklog.md 6번)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:mysql:1.21.4'
}

tasks.named('test') {
	useJUnitPlatform()
}
