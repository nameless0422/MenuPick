services:
  mysql:
    image: mysql:8.0
    container_name: menupick-mysql
    ports:
      # 루프백에만 바인딩한다. "3306:3306"은 0.0.0.0 바인딩이라 같은 공유기/카페 와이파이의
      # 다른 기기에서 menupick/menupick 계정으로 그대로 접속할 수 있다.
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: menupick
      MYSQL_USER: menupick
      MYSQL_PASSWORD: menupick
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      # utf8mb4_unicode_ci(UCA 4.0.0)는 모든 이모지를 같은 문자로 취급해
      # 닉네임·태그의 UNIQUE를 오작동시킨다(V7, issue #114). MySQL 8 기본값인
      # 0900_ai_ci는 UCA 9.0.0 기반이라 이모지를 정확히 구분한다.
      # 이 값은 새로 만들어지는 스키마의 기본값을 정한다 — 이미 만들어진
      # menupick 스키마 자체는 V7의 ALTER DATABASE가 바꾼다.
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: menupick-redis
    ports:
      # 로컬 Redis는 무인증이므로 외부 노출은 그대로 무단 접근이다. 루프백만 바인딩.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # 로컬 개발용 메일 서버. 받은 메일을 밖으로 내보내지 않고 붙잡아 웹 UI로 보여준다.
  #
  # 이게 없으면 로컬에서는 spring.mail.host를 비워 두고 인증 링크를 로그(WARN)로 떨어뜨려
  # 확인해야 하는데, 그 경로는 JavaMailSender를 아예 만들지 않아 "메일 발송"이라는 동작
  # 자체가 한 번도 실행되지 않는다. 제목이 깨지거나 링크가 잘못 조립돼도 로그에서는 멀쩡해 보인다.
  #
  # 쓰려면 앱에 아래를 준다 (application-local.yml의 기본값은 여전히 '발송 안 함'이다):
  #   SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025
  # 받은 메일은 http://localhost:8025 에서 본다.
  #
  # 여기(로컬)에만 두고 docker-compose.prod.yml에는 넣지 않는다. 운영은 실제 SMTP로 보내므로
  # 운영에 뜬 Mailpit은 아무것도 받지 못한 채 메모리와 포트만 차지한다(issue #87). 그런데도
  # 로컬에서 지우지 않는 이유는, 이게 없으면 로컬 검증 경로가 "링크를 로그로 확인"뿐이라
  # 발송 동작 자체가 한 번도 실행되지 않기 때문이다(위 문단). 운영에 필요 없다는 것과
  # 개발에 쓸모없다는 것은 다른 얘기다.
  mailpit:
    image: axllent/mailpit:latest
    container_name: menupick-mailpit
    ports:
      # 1025=SMTP, 8025=웹 UI. 둘 다 인증이 없으므로 루프백만 바인딩한다 —
      # 열어두면 같은 망의 누구나 이 서버로 메일을 보내고 받은 메일함을 들여다볼 수 있다.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      # 개발용이라 보관 상한만 두고 영속화하지 않는다. 컨테이너를 지우면 메일함도 비워진다.
      MP_MAX_MESSAGES: 500

volumes:
  mysql-data:
  redis-data:
